name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test          # real-file tests are skipped unless A2T_FIXTURES is set
      - run: npm run build
      - run: npm run check:icons   # icon files, manifest, and every URL in the built page (also under a sub-path)
