<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ToonBridge — Animate to ToonSquid converter</title>
    <meta name="description" content="Convert Adobe Animate (XFL) projects into ToonSquid .tsproj files, right in your browser. Nothing is uploaded." />
    <meta name="theme-color" content="#01caa8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1f1b" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Favicons: SVG first, PNG + ICO fallbacks. Paths are relative so they work under a sub-path (GitHub Pages) or at the root (Netlify). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" sizes="48x48" href="/favicon.ico" />
    <!-- Apple touch icons (iPhone / iPad Home Screen) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ToonBridge" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      html { background: #eefbf6; }
      @media (prefers-color-scheme: dark) { html { background: #0c1f1b; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="font-family:system-ui;padding:24px">ToonBridge needs JavaScript to convert files in your browser.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
